name: Build

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # disable the demon, as it's causing some problems,
      # and also silence a Gradle 9.1.0 native-access warning
      GRADLE_OPTS: -Dorg.gradle.daemon=false --enable-native-access=ALL-UNNAMED

    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.0.2'
          distribution: 'graalvm'

      - name: Cache Gradle packages
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test the project (all parts)
        run: ./gradlew build
